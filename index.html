<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firestore Greetings</title>
</head>

<body>
  <form id="greeting-form">
    <input type="text" id="greeting" placeholder="Enter a greeting..." required>
    <button type="submit">Send</button>
  </form>
  <p id="status"></p>

  <ul id="greetings-list"></ul>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD7CiBFLT-qOia531cPAWGm4th5i02hitE",
      authDomain: "demo2-e6329.firebaseapp.com",
      projectId: "demo2-e6329",
      storageBucket: "demo2-e6329.firebasestorage.app",
      messagingSenderId: "768361463955",
      appId: "1:768361463955:web:582deccf71f11ee077cd66"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("greeting-form");
    const input = document.getElementById("greeting");
    const status = document.getElementById("status");
    const greetingsList = document.getElementById("greetings-list");

    // Display existing greetings in real time
    const q = query(collection(db, "greetings"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      greetingsList.innerHTML = "";
      snapshot.forEach((doc) => {
        const li = document.createElement("li");
        li.textContent = doc.data().message;
        greetingsList.appendChild(li);
      });
    }, (error) => {
      console.error("Error reading greetings:", error);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      try {
        await addDoc(collection(db, "greetings"), {
          message,
          createdAt: serverTimestamp()
        });
        status.textContent = "Greeting saved!";
        form.reset();
      } catch (err) {
        console.error(err);
        status.textContent = "Error saving greeting.";
      }
    });
  </script>
</body>

</html>
