<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firestore Emails</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background: #f7f9fa;
      color: #1a1a1a;
      box-sizing: border-box;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
        color: #f0f0f0;
      }
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      padding: 1.5rem;
      border-radius: 12px;
      background: canvas;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(128, 128, 128, 0.2);
      box-sizing: border-box;
    }

    h1, h2 {
      margin: 0 0 1rem;
      font-size: 1.3rem;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .badge {
      background: rgba(0, 102, 204, 0.15);
      color: #0066cc;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    input[type="email"] {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      background: transparent;
      color: inherit;
      box-sizing: border-box;
    }

    input[type="email"]:focus {
      outline: 2px solid #0066cc;
      border-color: transparent;
    }

    button {
      padding: 0.75rem;
      background: #0066cc;
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity 0.2s;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      min-height: 1.2rem;
      word-break: break-word;
    }

    .success {
      color: #2e7d32;
    }

    .error {
      color: #d32f2f;
    }

    /* Lista de correos */
    .email-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 260px;
      overflow-y: auto;
    }

    .email-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      background: rgba(128, 128, 128, 0.08);
      font-size: 0.9rem;
      word-break: break-all;
    }

    .email-date {
      font-size: 0.75rem;
      opacity: 0.6;
      white-space: nowrap;
      margin-left: 0.5rem;
    }

    .empty-state {
      font-size: 0.85rem;
      opacity: 0.65;
      text-align: center;
      padding: 1rem 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Formulario -->
    <div class="card">
      <h1>Guardar Correo</h1>
      <form id="email-form">
        <input type="email" id="email" placeholder="ejemplo@correo.com" required />
        <button type="submit" id="submit-btn">Guardar</button>
      </form>
      <div id="status"></div>
    </div>

    <!-- Lista de Correos -->
    <div class="card">
      <div class="header-row">
        <h2 style="margin: 0;">Correos Registrados</h2>
        <span id="email-count" class="badge">0</span>
      </div>
      <ul id="email-list" class="email-list">
        <li class="empty-state">Cargando correos...</li>
      </ul>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCf180GyBT7EJvX3d3WXZDtI5PbbML5RHs",
      authDomain: "mi-pagina-ca035.firebaseapp.com",
      projectId: "mi-pagina-ca035",
      storageBucket: "mi-pagina-ca035.firebasestorage.app",
      messagingSenderId: "683444454809",
      appId: "1:683444454809:web:e80864be7ac070160cff08"
    };

    // Inicializar Firebase y Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Elementos del DOM
    const form = document.getElementById("email-form");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submit-btn");
    const statusEl = document.getElementById("status");
    const emailListEl = document.getElementById("email-list");
    const emailCountEl = document.getElementById("email-count");

    // 1. Guardar correo al enviar formulario
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Guardando...";
      statusEl.textContent = "";
      statusEl.className = "";

      try {
        await addDoc(collection(db, "emails"), {
          email,
          createdAt: serverTimestamp()
        });

        statusEl.textContent = "¡Correo guardado con éxito!";
        statusEl.className = "success";
        form.reset();
      } catch (error) {
        console.error("Firestore error al guardar:", error);
        statusEl.textContent = `Error: ${error.message}`;
        statusEl.className = "error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Guardar";
      }
    });

    // 2. Escuchar correos en tiempo real
    onSnapshot(collection(db, "emails"), (snapshot) => {
      emailCountEl.textContent = snapshot.size;

      if (snapshot.empty) {
        emailListEl.innerHTML = '<li class="empty-state">No hay correos guardados aún.</li>';
        return;
      }

      const emails = [];
      snapshot.forEach((doc) => {
        emails.push({ id: doc.id, ...doc.data() });
      });

      // Ordenar por fecha descendente
      emails.sort((a, b) => {
        const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt?.seconds ? a.createdAt.seconds * 1000 : 0);
        const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt?.seconds ? b.createdAt.seconds * 1000 : 0);
        return timeB - timeA;
      });

      emailListEl.innerHTML = "";
      emails.forEach((item) => {
        const li = document.createElement("li");
        li.className = "email-item";

        const emailSpan = document.createElement("span");
        emailSpan.textContent = item.email || "(sin correo)";

        const dateSpan = document.createElement("span");
        dateSpan.className = "email-date";
        if (item.createdAt?.toDate) {
          dateSpan.textContent = item.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else {
          dateSpan.textContent = "Reciente";
        }

        li.appendChild(emailSpan);
        li.appendChild(dateSpan);
        emailListEl.appendChild(li);
      });
    }, (error) => {
      console.error("Firestore error al leer:", error);
      emailListEl.innerHTML = `<li class="empty-state error">Error al leer: ${error.message}</li>`;
    });
  </script>
</body>

</html>
